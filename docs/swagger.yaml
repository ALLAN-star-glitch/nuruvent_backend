host: localhost:8080
info:
  contact:
    email: hello@nuruvent.com
    name: Nuruvent Support
    url: https://nuruvent.com
  description: |-
    Light Your Training Events. Illuminate Your Growth.
    The all-in-one platform for training events in Kenya.
  license:
    name: Proprietary
    url: https://nuruvent.com/license
  termsOfService: https://nuruvent.com/terms
  title: Nuruvent API
  version: 1.0.0
paths:
  /api/v1/accounts/{accountId}/events:
    get:
      description: Get all events for an account
      parameters:
      - description: Account ID
        in: path
        name: accountId
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get events by account
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: Create a new event for an account
      parameters:
      - description: Account ID
        in: path
        name: accountId
        required: true
        type: string
      - description: Event details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/eventhandler.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.Event'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create a new event
      tags:
      - Events
  /api/v1/accounts/{accountId}/events/{eventId}/certificate:
    post:
      consumes:
      - multipart/form-data
      description: Upload a certificate template for an event
      parameters:
      - description: Account ID
        in: path
        name: accountId
        required: true
        type: string
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Certificate template (PDF or image)
        in: formData
        name: certificate
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
