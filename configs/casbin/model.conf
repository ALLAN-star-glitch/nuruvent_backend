# Nuruvent Authorization Model
# RBAC with Domains (Multi-Tenant)
#
# ============================================================
# DOMAIN MODEL
# ============================================================
#
# Nuruvent uses exactly TWO domain families:
#
#   - "platform"           → Nuruvent staff only (super_admin, admin, guest)
#   - "account:<account_id>" → every tenant account
#
# Teams do NOT have their own authorization domains. Team membership is
# enforced as data (team_members table) in the service layer, not as
# Casbin policies. See "Nuruvent Team Management — Complete Business
# Documentation" §2.2 and §4.7.
#
# ============================================================
# WILDCARD DOMAIN MATCHING
# ============================================================
#
# Policies may use the wildcard pattern "account:*" to apply to every
# account domain. At check time, keyMatch2 resolves the pattern against
# the concrete domain from the request (e.g. "account:abc-123").
#
# This keeps the policy table small and static:
#
#   p, account_admin, account:*, event, create
#
# ...matches when a request arrives for any concrete account domain.
#
# IMPORTANT INVARIANTS:
#
#   1. Policies (p rules) use wildcards ("account:*").
#   2. Grouping rules (g rules) for user role assignments ALWAYS use
#      concrete domains ("account:<uuid>"). Never wildcards.
#   3. The only wildcard g rule is the role hierarchy:
#        g, account_admin, trainer, account:*
#      which grants role-to-role inheritance, not user-to-role binding.
#
# ============================================================

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

# ============================================================
# MATCHER
# ============================================================
#
# keyMatch2(r.dom, p.dom) — matches the request's concrete domain against
# the policy's pattern. Supports "account:*" wildcards in policies.
#
# r.obj == p.obj and r.act == p.act — exact match on resource and action.
# (No wildcard expansion for obj/act; policies enumerate them explicitly.)
#
# g(r.sub, p.sub, r.dom) — checks that the user's role in the request's
# domain matches the policy's subject. Uses concrete domain from the
# request, so role inheritance applies within the same domain.

[matchers]
m = keyMatch(r.dom, p.dom) \
    && r.obj == p.obj \
    && r.act == p.act \
    && g(r.sub, p.sub, r.dom)