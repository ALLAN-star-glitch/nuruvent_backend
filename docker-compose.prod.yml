services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuruvent-backend-prod
    env_file:
      - .env  # ← Load from .env file
    environment:
      # Override Docker-specific values
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis:6379
      CASBIN_MODEL: /root/configs/casbin/model.conf
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: nuruvent-postgres-prod
    environment:
      POSTGRES_USER: nuruvent_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nuruvent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuruvent_user -d nuruvent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: nuruvent-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  redis-data: