        type: integer
      name:
        description: workshop, webinar, meetup, bootcamp
        type: string
      slug:
        type: string
      sort_order:
        type: integer
      supports_certificate:
        description: Event type properties
        type: boolean
      updated_at:
        type: string
    type: object
  models.Media:
    properties:
      bucket:
        type: string
      created_at:
        type: string
      entity_id:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      media_type:
        allOf:
        - $ref: '#/definitions/models.MediaType'
        description: Relationships
      media_type_id:
