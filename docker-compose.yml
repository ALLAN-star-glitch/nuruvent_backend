services:
  # ============================================
  # BACKEND API (with embedded worker)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nuruvent-backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://nuruvent-redis:6379
      CASBIN_MODEL: /root/configs/casbin/model.conf
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/bin
      - /app/tmp
     # - /app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: air -c .air.toml
    networks:
      - nuruvent-network

  # ============================================
  # DATABASE (PostgreSQL)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: nuruvent-postgres
    environment:
      POSTGRES_USER: nuruvent_user
      POSTGRES_PASSWORD: nuruvent_user
      POSTGRES_DB: nuruvent
    ports:
      - "54582:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuruvent_user -d nuruvent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nuruvent-network

  # ============================================
  # REDIS (Cache + Queue)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: nuruvent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nuruvent-network

volumes:
  postgres-data:
  redis-data:

networks:
  nuruvent-network:
    driver: bridge