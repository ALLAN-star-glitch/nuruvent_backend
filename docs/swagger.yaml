      security:
      - BearerAuth: []
      summary: Upload certificate template
      tags:
      - Events
  /api/v1/accounts/{accountId}/events/{eventId}/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image for an event
      parameters:
      - description: Account ID
        in: path
        name: accountId
        required: true
        type: string
      - description: Event ID
        in: path
        name: eventId
        required: true
        type: string
      - description: Event image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
