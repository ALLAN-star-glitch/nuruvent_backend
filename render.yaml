services:
  # ============================================
  # COMBINED API & WORKER SERVICE (Free Tier)
  # ============================================
  - type: web
    name: nuruvent-api
    runtime: docker
    repo: https://github.com/ALLAN-star-glitch/nuruvent_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SERVER_PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: nuruvent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nuruvent-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 24h
      - key: JWT_REFRESH_EXPIRATION
        value: 168h
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply-nuruvent@nuruvent.com
      - key: CASBIN_MODEL
        value: /root/configs/casbin/model.conf
      - key: CASBIN_AUTO_LOAD
        value: "true"
      - key: CASBIN_AUTO_LOAD_INTERVAL
        value: 10s
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_EVENTS
        value: events
      - key: SUPABASE_BUCKET_BUSINESSES
        value: businesses
      - key: SUPABASE_BUCKET_PROFILES
        value: profiles
      - key: SUPABASE_BUCKET_CERTIFICATES
        value: certificates
      - key: SUPABASE_BUCKET_RECORDINGS
        value: recordings
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_ENVIRONMENT
        value: production

  # ============================================
  # MANAGED REDIS INSTANCE (Free Tier)
  # ============================================
  - type: keyvalue
    name: nuruvent-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ============================================
# MANAGED POSTGRESQL DATABASE (Free Tier)
# ============================================
databases:
  - name: nuruvent-db
    databaseName: nuruvent
    user: nuruvent_user
    plan: free