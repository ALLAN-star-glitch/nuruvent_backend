        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Upload event image
      tags:
      - Events
  /api/v1/accounts/{accountId}/events/with-image:
    post:
      consumes:
      - multipart/form-data
      description: Create a new event for an account with an image upload
      parameters:
      - description: Account ID
        in: path
        name: accountId
        required: true
        type: string
      - description: Event name
        in: formData
        name: name
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event Type ID
        in: formData
        name: event_type_id
        required: true
        type: string
      - description: Event date (YYYY-MM-DD)
        in: formData
        name: date
        required: true
        type: string
      - description: Event time (HH:MM)
        in: formData
        name: time
        required: true
        type: string
      - description: Event duration in minutes
        in: formData
        name: duration
        required: true
        type: integer
      - description: Event price
        in: formData
        name: price
        type: number
      - description: Certificate price
        in: formData
        name: certificate_price
        type: number
      - description: Event location
        in: formData
        name: location
        type: string
      - description: Is virtual event
        in: formData
        name: is_virtual
        type: boolean
      - description: Zoom link
        in: formData
        name: zoom_link
        type: string
      - description: Meet link
        in: formData
        name: meet_link
        type: string
      - description: Maximum attendees
        in: formData
        name: max_attendees
        type: integer
      - description: Event image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.Event'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create a new event with image
      tags:
      - Events
